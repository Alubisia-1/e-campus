<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>E-Soko - Campus Marketplace | Buy & Sell Student Items</title>
    <meta name="title" content="E-Soko - Campus Marketplace | Buy & Sell Student Items" />
    <meta name="description" content="E-Soko is your trusted campus marketplace for buying and selling textbooks, electronics, furniture, and more. Connect with students, find great deals, and sell items easily." />
    <meta name="keywords" content="campus marketplace, student marketplace, buy textbooks, sell electronics, college marketplace, student items, campus trading, e-soko" />
    <meta name="author" content="E-Soko" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <link rel="canonical" href="https://e-soko.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://e-soko.com/" />
    <meta property="og:title" content="E-Soko - Campus Marketplace | Buy & Sell Student Items" />
    <meta property="og:description" content="Your trusted campus marketplace for buying and selling textbooks, electronics, furniture, and more. Connect with students and find great deals." />

    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="E-Soko - Campus Marketplace | Buy & Sell Student Items" />
    <meta name="twitter:description" content="Your trusted campus marketplace for buying and selling textbooks, electronics, furniture, and more." />
    <meta name="twitter:image" content="https://e-soko.com/og-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "E-Soko",
      "description": "Campus marketplace for buying and selling student items",
      "url": "https://e-soko.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://e-soko.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "E-Soko",
      "url": "https://e-soko.com/",
      "logo": "https://e-soko.com/favicon.svg",
      "sameAs": [
        "https://www.instagram.com/e_sokostore/"
      ]
    }
    </script>
